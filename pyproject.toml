[project]
name = "grind"
version = "0.1.0"
description = "A terminal agent harness for any chat model, with a goal mode that keeps working until the job is done."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "openai>=1.60",
    "anthropic>=0.50",
    "httpx>=0.27",
    "rich>=13.9",
    "prompt_toolkit>=3.0.48",
    "tomli-w>=1.0",
]

[project.scripts]
grind = "grind.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
